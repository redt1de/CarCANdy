; Gauges for the Waveshare ESP32-S3-Touch-LCD-2.8C (2.8" round, 480x480, ST7701 RGB panel)

[platformio]
default_envs = waveshare_s3_lcd_28c

[env]
lib_deps =
    lvgl/lvgl@~9.3.0
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

[env:waveshare_s3_lcd_28c]
; pioarduino = Arduino core 3.x (ESP-IDF 5.x), which the RGB panel driver here is written against
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3R8: 16MB quad flash + 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.extra_flags =
    -D BOARD_HAS_PSRAM
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<sim_main.cpp>
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Headless PC build of the same UI code. Renders PNG frames so the face can be
; tweaked without flashing:
;   pio run -e sim && .pio/build/sim/program sim_out
; Optional arguments: <out_dir> <duration_ms> <ms_between_frames> <gauge, e.g. RPM> <colour, e.g. BLUE>
[env:sim]
platform = native
build_flags =
    ${env.build_flags}
    -lm
; live_data.cpp needs real Arduino/UART hardware (Serial1), so it's excluded
; here too -- GAUGES_DATA_SOURCE defaults to the simulator (see config.h),
; which is all this env can run anyway.
build_src_filter = +<*> -<main.cpp> -<display.cpp> -<live_data.cpp>
