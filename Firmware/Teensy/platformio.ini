[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps =
    https://github.com/tonton81/FlexCAN_T4.git
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit NeoPixel @ ^1.12.3
build_flags =
    -I ../Shared
    -std=gnu++17
build_unflags =
    -std=gnu++14
monitor_speed = 115200
lib_ldf_mode = deep+
