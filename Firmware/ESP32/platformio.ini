[env:esp32-s3-mini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
board_build.filesystem = littlefs
board_build.flash_mode = qio
board_build.psram_type = qio
board_build.arduino.memory_type = qio_qspi
build_flags =
    -I ../Shared
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; UART2 remapped via the GPIO matrix onto GP1(TX)/GP2(RX) -- this is a
    ; generic/clone board and its silkscreen "TX"/"RX" pin labels weren't
    ; reliably identifiable, so this uses two unambiguous numbered GPIOs
    ; instead. ARDUINO_USB_CDC_ON_BOOT above still matters here: it's what
    ; puts the debug Serial object on native USB, independent of this pin
    ; choice.
    ;
    ; NOTE: UART1 (Serial1) was tried first and did NOT work on this board
    ; even with identical pins/baud -- confirmed via a standalone test
    ; sketch that UART2 (HardwareSerial(2)) does work on GP1/GP2. No
    ; documented reservation of UART1 was found in the Arduino-ESP32 core
    ; source, so the cause is unconfirmed; this is going with the
    ; empirically-verified working configuration rather than theory.
    -DCARCANDY_UART_PORT=Serial2
    -DCARCANDY_UART_RX_PIN=2
    -DCARCANDY_UART_TX_PIN=1
lib_deps =
    esp32async/ESPAsyncWebServer @ ^3.11.2
    esp32async/AsyncTCP @ ^3.4.10
    bblanchon/ArduinoJson @ ^7.0.4

